<!DOCTYPE html>
<html>
<head>
<title>JS DOM Assignments</title>

<style>
body{
    font-family: Arial, sans-serif;
    padding:20px;
    transition:0.3s;
}

.dark{
    background:#111;
    color:white;
}

.section{
    border:1px solid #ccc;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

button{
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
}

.createdDiv{
    background:skyblue;
    padding:15px;
    margin-top:10px;
    border:1px solid black;
}

#dynamicBox{
    width:200px;
    height:120px;
    background:lightgreen;
    margin-top:10px;
    transition:0.3s;
}
</style>

</head>
<body>

<h1>JavaScript DOM Assignments</h1>

<!-- Assignment 1 -->
<div class="section">
    <h2>1. Dark Theme</h2>
    <button onclick="toggleTheme()">Toggle Theme</button>
</div>

<!-- Assignment 2 -->
<div class="section">
    <h2>2. Div Creation</h2>
    <button onclick="createDiv()">Create Div</button>
    <div id="divContainer"></div>
</div>

<!-- Assignment 3 -->
<div class="section">
    <h2>3. Hide / Show Paragraph</h2>

    <p id="para">
        This is a paragraph. Click the button to hide or show it.
    </p>

    <button onclick="toggleParagraph()">
        Hide / Show
    </button>
</div>

<!-- Assignment 4 -->
<div class="section">
    <h2>4. Dynamic CSS</h2>

    <button onclick="changeStyle()">
        Change CSS
    </button>

    <div id="dynamicBox"></div>
</div>

<script>

// Assignment 1
function toggleTheme(){
    document.body.classList.toggle("dark");
}

// Assignment 2
function createDiv(){

    let div = document.createElement("div");

    div.className = "createdDiv";

    div.innerHTML =
    "New Div Created Successfully";

    document
    .getElementById("divContainer")
    .appendChild(div);
}

// Assignment 3
function toggleParagraph(){

    let para =
    document.getElementById("para");

    if(para.style.display === "none"){
        para.style.display = "block";
    }
    else{
        para.style.display = "none";
    }
}

// Assignment 4
function changeStyle(){

    let box =
    document.getElementById("dynamicBox");

    box.style.backgroundColor = "orange";
    box.style.border = "4px solid black";
    box.style.borderRadius = "20px";
    box.style.transform = "rotate(5deg)";
}

</script>

</body>
</html>
